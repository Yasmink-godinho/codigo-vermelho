# Grafana Tempo em modo monolitico. Recebe os traces da aplicacao via OTLP (HTTP 4318 / gRPC 4317)
# e guarda os blocos no disco do conteiner (volume tempo-data).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # 0.0.0.0 e obrigatorio: nas versoes novas o padrao e escutar so em localhost,
        # e ai a aplicacao (outro conteiner) nao consegue enviar os traces.
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
