# Banco PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codigo_vermelho}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# CORS: origem(ns) do frontend em producao, separadas por virgula.
# Definir em producao via variavel de ambiente APP_CORS_ALLOWED_ORIGINS,
# ex: https://codigo-vermelho-web.onrender.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
