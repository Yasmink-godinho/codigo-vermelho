spring.application.name=codigo-vermelho
spring.profiles.active=dev

spring.jmx.enabled=false
server.tomcat.basedir=./target/tomcat

# Integração com Inteligência Artificial (XAI Gemini)
gemini.api.key=${GEMINI_API_KEY:}

server.port=${PORT:8080}

# ===================== Observabilidade (RSD) =====================
# Actuator numa porta SEPARADA (8081). No Docker Compose essa porta nao e publicada no host:
# so o Prometheus, dentro da rede interna, consegue ler /actuator/**. A API publica continua na 8080.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Tag application=codigo-vermelho em TODAS as metricas (filtro dos dashboards no Grafana)
management.metrics.tags.application=codigo-vermelho
# Histogramas para calcular p95/p99 no Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.codigovermelho.rota.calculo=true

# Informacoes exibidas em /actuator/info
management.info.env.enabled=true
info.app.nome=Codigo Vermelho
info.app.descricao=Gestao e distribuicao de hemocomponentes (Projeto Integrador ADS 2026.2)

# Tracing: 100% das requisicoes viram trace (ambiente de laboratorio). O endereco do Tempo NAO fica
# aqui: ele vem da variavel MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT definida no compose.
# Sem o compose (ex.: rodando local ou no Render) a app funciona normalmente, so nao exporta traces.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Exportacao de traces DESLIGADA por padrao (ex.: deploy no Render, onde nao existe Tempo).
# O docker compose liga com MANAGEMENT_TRACING_EXPORT_ENABLED=true.
management.tracing.export.enabled=false

# traceId e spanId em toda linha de log. O Grafana usa o "trace_id=" para pular do log (Loki) pro trace (Tempo).
logging.pattern.correlation=trace_id=%X{traceId:-} span_id=%X{spanId:-} 

# Endpoint de erro simulado (gera 500 para testar paineis e alertas). Desligado por padrao;
# o docker compose liga com APP_OBSERVABILIDADE_ENDPOINT_ERRO_HABILITADO=true.
app.observabilidade.endpoint-erro.habilitado=false
