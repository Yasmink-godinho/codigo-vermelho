# --- Banco H2 em Memória (Sem dependência de PostgreSQL local) ---
spring.datasource.url=jdbc:h2:mem:codigo_vermelho;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Console Web do H2 (Acessível em http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Correções de Ambiente Windows / Spring Boot 4.x ---
spring.jmx.enabled=false
server.tomcat.basedir=./target/tomcat
