spring.application.name=CodigoVermelho

# Ajuste usuario/senha conforme sua instalacao local do PostgreSQL.
# NUNCA versionar credenciais reais aqui (ver docs/COMO_EXECUTAR.md).
spring.datasource.url=jdbc:postgresql://localhost:5432/codigo_vermelho
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
